# Dependabot version updates, see
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# - cooldown: only versions released at least 14 days ago are proposed, a compromised release is usually found by
#   then. Security updates are not delayed by it.
# - groups: minor and patch updates come in one pull request per ecosystem, major updates one by one
# - target-branch: like every pull request, the updates go to develop; security updates still target the default
#   branch, which is develop as well

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      maven-minor-patch:
        update-types: [ "minor", "patch" ]
    ignore:
      # 3.x is built on Jackson 3 (tools.jackson), the JSON of Quarkus is still Jackson 2: raise it together with Quarkus
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "npm"
    directory: "/src/main/webapp"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: [ "minor", "patch" ]

  # base images of src/main/docker/Dockerfile.*
  - package-ecosystem: "docker"
    directory: "/src/main/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      docker-minor-patch:
        update-types: [ "minor", "patch" ]
    ignore:
      # the JRE follows the LTS releases and maven.compiler.release, not every feature release (e.g. 24, unsupported
      # since 25): raised by hand together with the build
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types: [ "minor", "patch" ]

  # chart dependencies (infinispan, keycloakx, authentik). An update of keycloak or authentik needs a new
  # version of that chart before the release (helm/check-chart-versions.sh)
  - package-ecosystem: "helm"
    directories:
      - "/helm/car-ledger"
      - "/helm/keycloak"
      - "/helm/authentik"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      helm-minor-patch:
        update-types: [ "minor", "patch" ]
