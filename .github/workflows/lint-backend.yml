name: Lint backend
# pull requests (also of dependabot) and the branches they go to
on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

# only reads the repository, the token gets no write access
permissions:
  contents: read

# a new push to a pull request cancels its older run, the other runs have a group of their own
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ./mvnw -B validate

    # broken references, HTML and tags in the Javadoc, see maven-javadoc-plugin in the pom
    - name: Javadoc
      run: ./mvnw -B -Dquarkus.quinoa=false javadoc:javadoc
