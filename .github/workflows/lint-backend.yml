name: Lint backend
on: [push]

# only reads the repository, the token gets no write access
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B validate
