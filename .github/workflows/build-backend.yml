name: Java CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Quinoa builds the frontend with the Node.js on the path, not the default one of the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build with Maven
        run: mvn -B verify

      # the build writes the OpenAPI spec of the backend to the frontend, the client is generated from it
      - name: Check the API spec and client are up to date
        run: |
          if ! git diff --exit-code -- src/main/webapp/public/openapi.json; then
            echo "::error::src/main/webapp/public/openapi.json differs from the backend, build the project and commit it"
            exit 1
          fi
          cd src/main/webapp
          yarn openapi-ts
          if ! git diff --exit-code -- src/generated; then
            echo "::error::The generated API client is outdated, run 'yarn openapi-ts' in src/main/webapp and commit it"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.run_number }}
            type=ref,event=branch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6.12.0
        with:
          context: .
          file: ./src/main/docker/Dockerfile.jvm
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The chart of this build: version <major>.<minor>.<run number> of Chart.yaml, its default image is the one
  # pushed above, so a published chart never points to an older image.
  chart:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Package the chart
        id: package
        env:
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          BASE=$(sed -n 's/^version: *//p' helm/car-ledger/Chart.yaml)
          VERSION="${BASE%.*}.${IMAGE_TAG}"
          helm dependency update helm/car-ledger
          helm package helm/car-ledger --version "$VERSION" --app-version "$IMAGE_TAG" --destination chart-dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$(ls chart-dist/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.file }}" "oci://${{ env.REGISTRY }}/${{ github.repository }}"
          echo "Chart ${{ steps.package.outputs.version }} with image ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
