name: Java CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image-tag }}

    steps:
      - uses: actions/checkout@v4

      # One version for the app, the image and the chart: a tag (e.g. 0.2.0) has to match the version of
      # Chart.yaml and is used as it is, every other build is <version of Chart.yaml>-dev.<run number>.
      # Checked before anything is published.
      - name: Version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(sed -n 's/^version: *//p' helm/car-ledger/Chart.yaml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$BASE" ]; then
              echo "::error::The tag $GITHUB_REF_NAME differs from the version $BASE of helm/car-ledger/Chart.yaml"
              exit 1
            fi
            VERSION="$BASE"
            IMAGE_TAG="$GITHUB_REF_NAME"
          else
            VERSION="$BASE-dev.$RUN_NUMBER"
            IMAGE_TAG="$RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Quinoa builds the frontend with the Node.js on the path, not the default one of the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # the version is shown at the start of the app
      - name: Build with Maven
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mvn -B verify -Drevision="$VERSION"

      # the build writes the OpenAPI spec of the backend to the frontend, the client is generated from it
      - name: Check the API spec and client are up to date
        run: |
          if ! git diff --exit-code -- src/main/webapp/public/openapi.json; then
            echo "::error::src/main/webapp/public/openapi.json differs from the backend, build the project and commit it"
            exit 1
          fi
          cd src/main/webapp
          yarn openapi-ts
          if ! git diff --exit-code -- src/generated; then
            echo "::error::The generated API client is outdated, run 'yarn openapi-ts' in src/main/webapp and commit it"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.run_number }}
            type=ref,event=branch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6.12.0
        with:
          context: .
          file: ./src/main/docker/Dockerfile.jvm
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The chart of this build, its default image is the one pushed above, so a published chart never points to an
  # older image. Builds of main publish the prerelease <version of Chart.yaml>-dev.<run number>, which helm only
  # installs with --devel or an explicit --version. A tag (e.g. 0.2.0, has to match the version of Chart.yaml)
  # publishes the chart in that version with the image of the tag, and creates the GitHub release.
  chart:
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      # the version of the build job, checked there against the tag
      - name: Package the chart
        id: package
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          helm dependency update helm/car-ledger
          helm package helm/car-ledger --version "$VERSION" --app-version "$IMAGE_TAG" --destination chart-dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "file=$(ls chart-dist/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.file }}" "oci://${{ env.REGISTRY }}/${{ github.repository }}"
          echo "Chart ${{ steps.package.outputs.version }} with image ${{ steps.package.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"

      # a release created in the GitHub UI (which pushes the tag) gets the versions and the chart as well
      - name: Create the release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.package.outputs.image-tag }}
          CHART: oci://${{ env.REGISTRY }}/${{ github.repository }}/helm
          VERSION: ${{ steps.package.outputs.version }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          cat > artifacts.md <<NOTES
          ## Artifacts

          | | |
          |---|---|
          | Image | \`$IMAGE\` |
          | Helm chart | \`$CHART\` version \`$VERSION\` |

          \`\`\`bash
          helm install car-ledger $CHART --version $VERSION --set ingress.host=example.com
          \`\`\`
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release view "$TAG" --json body --jq .body > existing.md
            cat artifacts.md existing.md > notes.md
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Version $TAG" --notes-file artifacts.md --generate-notes
          fi
