name: End-to-end tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

# only reads the repository, the token gets no write access
permissions:
  contents: read

# a new push to a pull request cancels its older run, the other runs have a group of their own
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # also for the updates of dependabot, e.g. of Playwright or Vite
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: src/main/webapp/yarn.lock

      - name: Install frontend dependencies
        working-directory: src/main/webapp
        run: yarn install --frozen-lockfile

      # the browser of the Playwright version in yarn.lock; the system libraries are not cached
      - name: Cache the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/main/webapp/yarn.lock') }}

      - name: Install the browser
        working-directory: src/main/webapp
        run: npx playwright install --with-deps chromium

      # starts Quarkus in dev mode (dev services: PostgreSQL, Keycloak, Infinispan) and Vite
      - name: Run the end-to-end tests
        working-directory: src/main/webapp
        run: yarn test:e2e

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/main/webapp/playwright-report
            src/main/webapp/test-results
          retention-days: 7
