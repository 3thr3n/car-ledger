name: End-to-end tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies and the browser
        working-directory: src/main/webapp
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium

      # starts Quarkus in dev mode (dev services: PostgreSQL, Keycloak, Infinispan) and Vite
      - name: Run the end-to-end tests
        working-directory: src/main/webapp
        run: yarn test:e2e

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/main/webapp/playwright-report
            src/main/webapp/test-results
          retention-days: 7
