name: Lint and test frontend
# pull requests (also of dependabot) and the branches they go to
on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

# only reads the repository, the token gets no write access
permissions:
  contents: read

# a new push to a pull request cancels its older run, the other runs have a group of their own
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # ESLint 10 needs ^22.13.0, vitest ^22.12.0 || ^24 || >=26, Node 20 is end of life
        node_version: [ 22, 24 ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node_version }}
        cache: yarn
        cache-dependency-path: src/main/webapp/yarn.lock

    - name: Lint, type check and unit tests
      run: |
        cd src/main/webapp
        yarn install --frozen-lockfile
        yarn lint
        yarn tsc -b
        yarn test
