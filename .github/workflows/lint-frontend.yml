name: Lint and test frontend
on: [push]

# only reads the repository, the token gets no write access
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # ESLint 10 needs ^22.13.0, vitest ^22.12.0 || ^24 || >=26, Node 20 is end of life
        node_version: [ 22, 24 ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node_version }}

    - name: Lint, type check and unit tests
      run: |
        cd src/main/webapp
        yarn install --frozen-lockfile
        yarn lint
        yarn tsc -b
        yarn test
