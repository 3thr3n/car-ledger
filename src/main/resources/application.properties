%prod.quarkus.management.enabled=true
%dev.quarkus.http.port=8080
quarkus.rest.path=/api
#
quarkus.smallrye-openapi.store-schema-directory=target
# version of the API itself, not of the app: the spec is committed and checked by the CI, it must not change with
# every build
quarkus.smallrye-openapi.info-version=1
# the API of the GPS trackers isn't part of the spec and the client of the frontend (docs/GPS_TRACKER.md)
mp.openapi.scan.exclude.packages=de.codeflowwizardry.carledger.rest.device
# Postgres
quarkus.datasource.db-kind=postgresql
# JSON columns (the payload of the requests) use the defaults of Hibernate, not the JSON settings of the REST API
quarkus.hibernate-orm.mapping.format.global=ignore
## test
#%test.quarkus.datasource.db-kind=h2
#%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test
%dev.quarkus.datasource.devservices.port=5678
# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.clean-at-start=false
## dev/test
%dev.quarkus.flyway.clean-at-start=false
%dev.quarkus.flyway.locations=db/migration,db/dev
%test.quarkus.flyway.clean-at-start=true
# used to check the amount of queries in tests
%test.quarkus.hibernate-orm.statistics=true
# OIDC
# the browser logs in with the code flow; a request with "Authorization: Bearer" is checked as access token instead,
# e.g. of a service account calling the admin API (see docs/DEPLOYMENT.md#service-accounts)
quarkus.oidc.application-type=hybrid
#
quarkus.oidc.authentication.redirect-path=/api/auth/callback
# errors of the provider (e.g. a cancelled login) are shown on the error page of the frontend
quarkus.oidc.authentication.error-path=/api/auth/error
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.session-age-extension=10M
#
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.cookie-same-site=strict
quarkus.oidc.authentication.cookie-force-secure=true
# TLS ends at the ingress, the app itself is called with http: the redirect_uri and the
# post_logout_redirect_uri use https anyway, as the provider only accepts the registered https URLs
# (and the browser drops the secure cookies on a callback with http, the login fails with 401)
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
#
# access tokens (Authorization: Bearer) are only accepted for CarLedger itself, not for other clients of the same
# realm: their audience (aud) has to name the client. The ID tokens of the login name it anyway. The tokens of the
# dev service have no audience.
%prod.quarkus.oidc.token.audience=${quarkus.oidc.client-id}
quarkus.oidc.token.allow-jwt-introspection=true
quarkus.oidc.token.allow-opaque-token-introspection=true
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token.refresh-token-time-skew=2M
#
quarkus.oidc.logout.path=/api/auth/logout
quarkus.oidc.logout.post-logout-path=/api/auth/logout-callback
redirect.to.logout=../
## dev
%dev.redirect.to.logout=http://localhost:5173
%dev.quarkus.keycloak.devservices.port=32323
# Infinispan dev service, pinned ("latest" is used otherwise). 15.2, as the 16.x images
# need a x86-64-v3 CPU, which e.g. VMs with a default QEMU CPU model do not offer
quarkus.infinispan-client.devservices.image-name=quay.io/infinispan/server:15.2
# Auth
## api
quarkus.http.auth.permission.logic.paths=/api*
quarkus.http.auth.permission.logic.policy=allowUser
## admin api
quarkus.http.auth.permission.admin.paths=/api/admin*
quarkus.http.auth.permission.admin.policy=allowAdmin
## GPS trackers: only the token of a tracker (DeviceAuthenticationMechanism), OIDC isn't asked
quarkus.http.auth.permission.device.paths=/api/device/*
quarkus.http.auth.permission.device.policy=allowDevice
quarkus.http.auth.permission.device.auth-mechanism=device
## public
quarkus.http.auth.permission.public.paths=/*,/api/auth/callback,/api/auth/logout-callback,/api/auth/error
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.methods=GET,HEAD
## roles
quarkus.http.auth.policy.allowUser.roles-allowed=user,admin
quarkus.http.auth.policy.allowAdmin.roles-allowed=admin
quarkus.http.auth.policy.allowDevice.roles-allowed=device
# Cors
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.exposed-headers=Location
# Security headers
## every response: no guessing of content types, the full URL only for requests to this origin
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=same-origin
## HTTPS only, for a year (TLS ends at the ingress, the browser sees https)
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000
## the pages of the app, not the API (the attachments send their own, stricter policy): only scripts, fonts and
## images of this origin (blob: for the previews of uploads), the styles of MUI inline, never in a frame of another
## site, the service worker of this origin
quarkus.http.filter.app-pages.matches=^(?!/api/|/q/).*
quarkus.http.filter.app-pages.header."Content-Security-Policy"=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
quarkus.http.filter.app-pages.header."X-Frame-Options"=DENY
# Quinoa
# Disable quinoa in dev so it does not restart always the server
%dev.quarkus.quinoa=false
quarkus.quinoa.build-dir=dist
quarkus.quinoa.ui-dir=src/main/webapp
quarkus.quinoa.enable-spa-routing=true
# the version of the build for the frontend as well, it compares it with the one of the server (GET /api/version)
quarkus.quinoa.package-manager-command.build-env.VITE_APP_VERSION=${quarkus.application.version}
## dev-server
quarkus.quinoa.dev-server=false
# LOGGING
## debug oidc
#%dev.quarkus.log.category."io.quarkus.oidc".min-level=DEBUG
#%dev.quarkus.log.category."io.quarkus.oidc".level=DEBUG
%dev.quarkus.log.category."de.codeflowwizardry.carledger.state".min-level=DEBUG
%dev.quarkus.log.category."de.codeflowwizardry.carledger.state".level=DEBUG
# Attachments
## a file may have 10 MB, the request a bit more for the multipart envelope
carledger.attachments.max-size=10M
carledger.attachments.max-per-bill=10
quarkus.http.limits.max-body-size=12M
## small limits, so the tests can reach them
%test.carledger.attachments.max-size=64K
%test.carledger.attachments.max-per-bill=3
# Mails
## notifications by e-mail, the SMTP server is set with quarkus.mailer.* (host, port, from, username, password,
## start-tls); in dev and test the mailer only logs the mails (quarkus.mailer.mock)
carledger.mail.enabled=false
%dev.carledger.mail.enabled=true
%dev.carledger.mail.app-url=http://localhost:5173
%dev.quarkus.mailer.from=CarLedger <car-ledger@localhost>
%test.carledger.mail.enabled=true
%test.carledger.mail.app-url=https://car-ledger.example.com
%test.carledger.mail.backoff=PT0.01S
%test.quarkus.mailer.from=CarLedger <car-ledger@example.com>
## the daily mail of the due reminders (carledger.mail.reminders-cron, 07:00 in the time zone of the server by
## default); off in the tests, they start it themselves
%test.carledger.mail.reminders-cron=off
# Web Push
## notifications to the browsers that subscribed (carledger.push.*): the key of the server in
## carledger.push.private-key, without one a new key with every start (dev, test)
%dev.carledger.push.enabled=true
%dev.carledger.push.subject=mailto:car-ledger@localhost
%test.carledger.push.enabled=true
%test.carledger.push.backoff=PT0.01S
## the push service of the tests runs on localhost
%test.carledger.push.allowed-hosts=localhost:*,push.example.com
# GPS trackers
## requests per tracker and minute (carledger.tracker.rate-limit), points per request (carledger.tracker.max-batch);
## small limits, so the tests can reach them
%test.carledger.tracker.rate-limit=5
%test.carledger.tracker.max-batch=10
