landing:
  eyebrow: "Car cost tracking"
  title: "Know what your car really costs."
  subtitle: "Log refuels, charges, workshop visits, insurance and everything else, and keep the papers of your car at hand. CarLedger turns your receipts into cost per kilometer, consumption and trends."
  cta: "Log in to start"
  ctaDashboard: "Open dashboard"
  features:
    fuel:
      title: "Refuels"
      text: "Enter any two of total, liters and price per liter — the rest, including consumption, is calculated."
    maintenance:
      title: "Maintenance"
      text: "Workshop, odometer, labor and parts for every service and repair."
    recurring:
      title: "Recurring costs"
      text: "Insurance, financing and other fixed costs are booked automatically on every due date."
    miscellaneous:
      title: "Everything else"
      text: "Car wash, parking, vignettes — anything with a receipt."
    import:
      title: "CSV import"
      text: "Bring your history along: map the columns of any CSV export and import it at once."
    stats:
      title: "Statistics"
      text: "Cost per km, consumption and highs and lows — per car or across all your cars."
    charging:
      title: "Charging"
      text: "Electric and plug-in hybrid cars: kWh, price and the consumption in kWh/100 km next to the refuels."
    modifications:
      title: "Modifications"
      text: "Rims, coilovers, exhaust: with their ABE, Teilegutachten or Einzelabnahme, the conditions and the documents."
    inspections:
      title: "HU"
      text: "The Hauptuntersuchung with its result, the defects and the report; the next due month becomes the reminder."
    papers:
      title: "Papers as PDF"
      text: "The modifications and the HUs with all their documents in one PDF, for a check or when selling the car."
    reminders:
      title: "Reminders"
      text: "Service, tires, vignette: due by date or mileage, by e-mail and push message."
    trips:
      title: "Trip log"
      text: "Start and finish trips with the odometer, deleted ones stay with their reason, export as PDF or CSV."
    gps:
      title: "GPS tracking"
      text: "A tracker in the car sends its route: the map by speed or by how often you drove it, forgotten trips suggested."
    offline:
      title: "App and offline"
      text: "On the home screen like an app; refuels and trips work without a connection, the papers stay on the phone."
    backup:
      title: "Backup"
      text: "All your data with the receipts and documents as one file, restored on any installation."

