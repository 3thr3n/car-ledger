landing:
  eyebrow: "Fahrzeugkosten im Blick"
  title: "Wisse, was dein Auto wirklich kostet."
  subtitle: "Erfasse Tankungen, Ladungen, Werkstattbesuche, Versicherung und alles andere und hab die Papiere deines Autos immer dabei. CarLedger macht aus deinen Belegen Kosten pro Kilometer, Verbrauch und Trends."
  cta: "Anmelden und loslegen"
  ctaDashboard: "Zum Dashboard"
  features:
    fuel:
      title: "Tanken"
      text: "Zwei von Betrag, Litern und Literpreis genügen — der Rest inklusive Verbrauch wird berechnet."
    maintenance:
      title: "Wartung"
      text: "Werkstatt, Kilometerstand, Arbeitslohn und Teile für jeden Service und jede Reparatur."
    recurring:
      title: "Laufende Kosten"
      text: "Versicherung, Finanzierung und andere Fixkosten werden an jedem Fälligkeitstag automatisch gebucht."
    miscellaneous:
      title: "Alles andere"
      text: "Waschanlage, Parken, Vignetten — alles mit Beleg."
    import:
      title: "CSV-Import"
      text: "Nimm deine Historie mit: Spalten eines beliebigen CSV-Exports zuordnen und auf einmal importieren."
    stats:
      title: "Statistiken"
      text: "Kosten pro km, Verbrauch sowie Höchst- und Tiefstwerte — pro Fahrzeug oder für alle zusammen."
    charging:
      title: "Laden"
      text: "Elektro- und Plug-in-Hybride: kWh, Preis und der Verbrauch in kWh/100 km neben den Tankungen."
    modifications:
      title: "Umbauten"
      text: "Felgen, Gewindefahrwerk, Auspuff: mit ABE, Teilegutachten oder Einzelabnahme, den Auflagen und den Dokumenten."
    inspections:
      title: "HU"
      text: "Die Hauptuntersuchung mit Ergebnis, Mängeln und Prüfbericht; der nächste Termin wird zur Erinnerung."
    papers:
      title: "Papiere als PDF"
      text: "Die Umbauten und die HUs mit allen Dokumenten in einem PDF, für eine Kontrolle oder den Verkauf."
    reminders:
      title: "Erinnerungen"
      text: "Inspektion, Reifen, Vignette: fällig nach Datum oder Kilometerstand, per E-Mail und Push-Nachricht."
    trips:
      title: "Fahrtenbuch"
      text: "Fahrten mit Kilometerstand beginnen und beenden, gelöschte bleiben mit Grund, Export als PDF oder CSV."
    gps:
      title: "GPS-Tracking"
      text: "Ein Tracker im Auto sendet die Strecke: die Karte nach Tempo oder Häufigkeit, vergessene Fahrten vorgeschlagen."
    offline:
      title: "App und offline"
      text: "Auf dem Startbildschirm wie eine App; Tankungen und Fahrten gehen ohne Verbindung, die Papiere bleiben auf dem Handy."
    backup:
      title: "Sicherung"
      text: "Alle deine Daten mit Belegen und Dokumenten in einer Datei, auf jeder Installation wiederherstellbar."

