# Valhalla (https://valhalla.github.io/valhalla/) for the map matching of CarLedger: the app sends the points of the
# finished drives, Valhalla returns them on the roads (docs/GPS_TRACKER.md#map-matching). Self-hosted, so the
# positions of the users stay in the cluster.
#
# On the first start it downloads the extracts of OpenStreetMap and builds its routing tiles into the volume: for
# Germany, Austria and Switzerland about an hour and several GB of memory, too much for a small server: then build
# them on another machine (tiles.volume). Later starts use the tiles. Newer map data is loaded by hand, see
# docs/GPS_TRACKER.md#map-matching.

image:
  repository: ghcr.io/valhalla/valhalla-scripted
  # defaults to the appVersion of the chart
  tag: ""

# Finished tiles instead of the build on the first start: built on another machine with
# hack/map-matching/build-tiles.sh, e.g. a development machine, the server only serves them (no download, no build,
# no volume of its own; extracts, persistence and startupProbe are not used). A volume source with valhalla_tiles.tar
# and valhalla.json, e.g. the image of the script (Kubernetes 1.33+), from a private registry with imagePullSecrets:
#   volume:
#     image:
#       reference: git.example.com/me/car-ledger-tiles:2026-11
#       pullPolicy: IfNotPresent
# New map data: build again and set the new tag. See docs/GPS_TRACKER.md#map-matching
tiles:
  volume: {}
  # directory of the volume with the two files, its root without one
  subPath: ""

# secrets of type kubernetes.io/dockerconfigjson for private registries, e.g. [{name: regcred}]: for the image of
# Valhalla and the one of tiles.volume
imagePullSecrets: []

# the extracts of OpenStreetMap the tiles are built from, e.g. of https://download.geofabrik.de: Germany, Austria and
# Switzerland in one. Several extracts that overlap at their borders can make the build fail (Failed tile ...
# vector::_M_range_check, exit code 1); take one that covers them all, e.g. a region of Geofabrik
extracts:
  - https://download.geofabrik.de/europe/dach-latest.osm.pbf

# threads of the build and the service
threads: 2

# the extracts, the tiles and their tarball: about 3× the size of the extracts
persistence:
  size: 40Gi
  storageClass:

# the build of the tiles needs the most, the service about the size of the tiles that are used: with tiles.volume
# and the tiles of Germany, Austria and Switzerland about 150 MB, e.g. requests 256Mi and a limit of 1Gi
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 8Gi

# the build of the tiles counts as the start: up to 12 hours by default
startupProbe:
  periodSeconds: 60
  failureThreshold: 720

# only CarLedger reaches the service; needs a network plugin that enforces NetworkPolicies
networkPolicy:
  enabled: true
  # further sources: entries of NetworkPolicy ingress "from", e.g. CarLedger in another namespace
  # (- namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: car-ledger}}
  #    podSelector: {matchLabels: {app: car-ledger}})
  extraFrom: []
