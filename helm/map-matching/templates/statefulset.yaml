apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mapMatching.name" . }}
  labels:
    app.kubernetes.io/name: map-matching
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  serviceName: {{ include "mapMatching.name" . }}
  selector:
    matchLabels:
      app.kubernetes.io/name: map-matching
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: map-matching
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # the user valhalla of the image; another group than its own, the scripts only use sudo with both 59999
        runAsUser: 59999
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valhalla
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8002
          env:
            # downloaded on the first start, when the volume has neither extracts nor tiles
            - name: tile_urls
              value: {{ join " " .Values.extracts | quote }}
            - name: server_threads
              value: {{ .Values.threads | quote }}
            # the tiles of the volume as they are, also when an extract changed: new data by hand
            - name: use_tiles_ignore_pbf
              value: "True"
            - name: build_tar
              value: "True"
            - name: serve_tiles
              value: "True"
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /custom_files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
