{{- /*
Two ways to the tiles: built from .Values.extracts into the volume on the first start, or finished ones of
hack/map-matching/build-tiles.sh in .Values.tiles.volume, which are only served
*/}}
{{- $prebuilt := not (empty .Values.tiles.volume) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mapMatching.name" . }}
  labels:
    app.kubernetes.io/name: map-matching
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  serviceName: {{ include "mapMatching.name" . }}
  selector:
    matchLabels:
      app.kubernetes.io/name: map-matching
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: map-matching
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # the user valhalla of the image; another group than its own, the scripts only use sudo with both 59999
        runAsUser: 59999
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: valhalla
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8002
          {{- if $prebuilt }}
          # only the service, on the config of the tiles
          command: [ "valhalla_service", "/tiles/valhalla.json", {{ .Values.threads | quote }} ]
          {{- else }}
          env:
            # downloaded on the first start, when the volume has neither extracts nor tiles
            - name: tile_urls
              value: {{ join " " .Values.extracts | quote }}
            - name: server_threads
              value: {{ .Values.threads | quote }}
            # the tiles of the volume as long as their build finished: its hashes (of the file names) are only
            # written by a finished build, a failed one is built again on the next start instead of being served
            # without its roads. A newer extract under the same name keeps the tiles: new data by hand
            - name: use_tiles_ignore_pbf
              value: "False"
            - name: build_tar
              value: "True"
            - name: serve_tiles
              value: "True"
          {{- end }}
          startupProbe:
            httpGet:
              path: /status
              port: http
            {{- if $prebuilt }}
            # loading the tiles takes seconds
            periodSeconds: 5
            failureThreshold: 60
            {{- else }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            {{- end }}
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if $prebuilt }}
            - name: tiles
              mountPath: /tiles
              readOnly: true
              {{- with .Values.tiles.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- else }}
            - name: data
              mountPath: /custom_files
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { }
        {{- if $prebuilt }}
        - name: tiles
          {{- toYaml .Values.tiles.volume | nindent 10 }}
        {{- end }}
  {{- if not $prebuilt }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
