suite: Valhalla of the map matching
templates:
  - templates/statefulset.yaml
  - templates/service.yaml
  - templates/networkpolicy.yaml
release:
  name: map-matching
  namespace: maps
tests:
  - it: builds the tiles of Germany, Austria and Switzerland and keeps them
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/valhalla/valhalla-scripted:3.9.1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: tile_urls
            value: >-
              https://download.geofabrik.de/europe/germany-latest.osm.pbf
              https://download.geofabrik.de/europe/austria-latest.osm.pbf
              https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: use_tiles_ignore_pbf
            value: "False"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 40Gi

  - it: runs hardened, without the sudo of the image
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 59999
            runAsGroup: 1001
            fsGroup: 1001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            readOnlyRootFilesystem: true
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: allows hours for the build of the tiles
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 720

  - it: is named after the release on its own
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: map-matching

  - it: is named after the stack in the stack, where the app finds it
    template: templates/service.yaml
    release:
      name: car-ledger
    set:
      global.mapMatching.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: car-ledger-map-matching

  - it: lets only the app in
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.extraFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: car-ledger
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app: car-ledger
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: car-ledger
              ports:
                - port: 8002
                  protocol: TCP

  - it: has no policy when turned off
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
