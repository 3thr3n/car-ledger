{{- /*
Only authentik reaches its PostgreSQL (and what networkPolicy.extraFrom allows). authentik itself is not restricted. Needs a
network plugin that enforces NetworkPolicies, ignored by the others.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "carLedgerAuthentik.prefix" . }}-postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ include "carLedgerAuthentik.prefix" . }}
      app.kubernetes.io/component: primary
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
