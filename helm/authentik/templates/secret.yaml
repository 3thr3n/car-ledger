{{- /* Secrets are generated on the first install and kept on upgrades */}}
{{- $generated := (lookup "v1" "Secret" .Release.Namespace "authentik-generated").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: authentik-generated
type: Opaque
data:
  # signs cookies and derives the unique user ids, never change it after the first install
  secret-key: {{ get $generated "secret-key" | default (randAlphaNum 60 | b64enc) }}
  postgres-password: {{ get $generated "postgres-password" | default (randAlphaNum 24 | b64enc) }}

---
{{- $bootstrap := (lookup "v1" "Secret" .Release.Namespace "authentik-bootstrap").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: authentik-bootstrap
type: Opaque
data:
  # password of akadmin, only read on the first start of authentik
  email: {{ .Values.bootstrap.email | b64enc }}
  password: {{ .Values.bootstrap.password | b64enc | default $bootstrap.password | default (randAlphaNum 24 | b64enc) }}

---
{{- /* the secret of CarLedger, generated once: kept from this namespace, else from the one of CarLedger */}}
{{- $oidcNamespace := .Values.carLedger.namespace | default .Release.Namespace }}
{{- $oidc := (lookup "v1" "Secret" .Release.Namespace "car-ledger-oidc").data | default dict }}
{{- if not $oidc }}
{{- $oidc = (lookup "v1" "Secret" $oidcNamespace "car-ledger-oidc").data | default dict }}
{{- end }}
{{- $oidcData := dict
      "secret" ($oidc.secret | default (randAlphaNum 64 | b64enc))
      "state-secret" (get $oidc "state-secret" | default (randAlphaNum 64 | b64enc)) }}
{{- $namespaces := list .Release.Namespace }}
{{- if ne $oidcNamespace .Release.Namespace }}
{{- /* the pods of CarLedger only read secrets of their own namespace */}}
{{- $namespaces = append $namespaces $oidcNamespace }}
{{- end }}
{{- range $index, $namespace := $namespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: car-ledger-oidc
  namespace: {{ $namespace }}
type: Opaque
data:
  # client secret of CarLedger, set in authentik by the blueprint
  secret: {{ $oidcData.secret }}
  # encrypts the PKCE state cookie of CarLedger during the login
  state-secret: {{ get $oidcData "state-secret" }}
{{- end }}
