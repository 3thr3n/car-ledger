{{- $pg := .Values.postgresql }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgresql-config
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Configs live outside of PGDATA, as in the PostgreSQL of the other charts
  postgresql.conf: |
    listen_addresses = '*'
  pg_hba.conf: |
    local all all trust
    host  all all 127.0.0.1/32 trust
    host  all all ::1/128 trust
    host  all all all scram-sha-256

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: primary
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: primary
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: primary
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid/gid 1001 as in the PostgreSQL of the other charts
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          args:
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
            - "-c"
            - "hba_file=/etc/postgresql/pg_hba.conf"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          env:
            # the volume is mounted on the VOLUME of the image, the database lives in its "data" directory
            - name: PGDATA
              value: /var/lib/postgresql/data/data
            - name: POSTGRES_DB
              value: {{ .Values.authentik.authentik.postgresql.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.authentik.authentik.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-generated
                  key: postgres-password
          livenessProbe:
            exec:
              command: [ "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-postgresql-config
        - name: run
          emptyDir: { }
        - name: dshm
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if $pg.persistence.storageClass }}
        storageClassName: {{ $pg.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
