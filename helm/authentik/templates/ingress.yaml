{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  {{- if or .Values.ingress.certManager .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.certManager }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManager }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls }}
  tls:
    - hosts:
        - {{ required "hostname is required" (include "carLedgerAuthentik.hostname" .) }}
      secretName: authentik-ingress-tls
  {{- end }}
  rules:
    - host: {{ required "hostname is required" (include "carLedgerAuthentik.hostname" .) }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "authentik.serverService" . }}
                port:
                  name: http
            path: /
            pathType: Prefix
{{- end }}
