suite: secrets of authentik and of CarLedger
templates:
  - templates/secret.yaml
release:
  name: authentik
  namespace: auth
set:
  hostname: authentik.example.com
  carLedger.hostname: car-ledger.example.com
tests:
  - it: generates the secrets on the first install
    asserts:
      - hasDocuments:
          count: 3
      - exists:
          path: data["secret-key"]
        documentSelector:
          path: metadata.name
          value: authentik-generated
      - equal:
          path: data.email
          value: YWRtaW5AZXhhbXBsZS5jb20= # admin@example.com
        documentSelector:
          path: metadata.name
          value: authentik-bootstrap
      - matchRegex:
          path: data.secret
          pattern: ^[A-Za-z0-9+/=]{80,}$
        documentSelector:
          path: metadata.name
          value: car-ledger-oidc

  - it: creates the secret of CarLedger in its namespace as well
    set:
      carLedger.namespace: car-ledger
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.namespace
          value: car-ledger
        documentIndex: 3
      - equal:
          path: metadata.name
          value: car-ledger-oidc
        documentIndex: 3

  - it: keeps the secrets on an upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: authentik-generated
            namespace: auth
          data:
            secret-key: a2V5
            postgres-password: cGc=
        - kind: Secret
          apiVersion: v1
          metadata:
            name: car-ledger-oidc
            namespace: auth
          data:
            secret: Y2xpZW50
            state-secret: c3RhdGU=
    asserts:
      - equal:
          path: data
          value:
            secret-key: a2V5
            postgres-password: cGc=
        documentSelector:
          path: metadata.name
          value: authentik-generated
      - equal:
          path: data
          value:
            secret: Y2xpZW50
            state-secret: c3RhdGU=
        documentSelector:
          path: metadata.name
          value: car-ledger-oidc

  - it: takes the secret of CarLedger from its namespace
    set:
      carLedger.namespace: car-ledger
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: car-ledger-oidc
            namespace: car-ledger
          data:
            secret: Y2xpZW50
            state-secret: c3RhdGU=
    asserts:
      - equal:
          path: data.secret
          value: Y2xpZW50
        documentIndex: 2
      - equal:
          path: data.secret
          value: Y2xpZW50
        documentIndex: 3
