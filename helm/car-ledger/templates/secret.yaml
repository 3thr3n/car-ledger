{{- /* Passwords are generated on the first install and kept on upgrades */}}
{{- if .Values.infinispan.enabled }}
{{- $ispnName := .Values.infinispan.deploy.security.secretName }}
{{- $ispnSecret := (lookup "v1" "Secret" .Release.Namespace $ispnName).data | default dict }}
{{- $ispnPassword := $ispnSecret.password | default (randAlphaNum 24 | b64enc) | b64dec }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ispnName }}
type: Opaque
stringData:
  username: "infinispan"
  password: {{ $ispnPassword | quote }}
  identities-batch: |-
    user create infinispan -p {{ $ispnPassword }} -g admin
{{- end }}

{{- if .Values.carledgerpostgres.enabled }}
{{- $pgName := .Values.carledgerpostgres.auth.existingSecret }}
{{- $pgKey := .Values.carledgerpostgres.auth.secretKeys.adminPasswordKey }}
{{- $pgSecret := (lookup "v1" "Secret" .Release.Namespace $pgName).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
type: Opaque
data:
  {{ $pgKey }}: {{ get $pgSecret $pgKey | default (randAlphaNum 24 | b64enc) }}
{{- end }}

{{- with .Values.carLedger.push }}
{{- if and .enabled (not .existingSecret) }}
{{- /* the key of the server for Web Push, generated once: a new key ends all subscriptions */}}
{{- $pushSecret := (lookup "v1" "Secret" $.Release.Namespace "car-ledger-push").data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: car-ledger-push
type: Opaque
data:
  {{ .privateKeyKey }}: {{ get $pushSecret .privateKeyKey | default (genPrivateKey "ecdsa" | b64enc) }}
{{- end }}
{{- end }}
