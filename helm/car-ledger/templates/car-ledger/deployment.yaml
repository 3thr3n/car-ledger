apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-ledger
  labels:
    app: car-ledger
spec:
  replicas: {{ .Values.carLedger.replicas }}
  selector:
    matchLabels:
      app: car-ledger
  template:
    metadata:
      labels:
        app: car-ledger
    spec:
      automountServiceAccountToken: false
      serviceAccountName: "car-ledger-sa"
      {{- with .Values.carLedger.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.carLedger.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: car-ledger
          image: "{{ .Values.carLedger.image.repository }}:{{ .Values.carLedger.image.tag | default .Chart.AppVersion }}"
          securityContext:
            {{- toYaml .Values.carLedger.securityContext | nindent 12 }}
          ports:
            - name: access
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: {{ include "carLedger.authUrl" . | quote }}
            - name: QUARKUS_OIDC_CLIENT_ID
              value: {{ include "carLedger.authClientId" . | quote }}
            - name: QUARKUS_OIDC_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "carLedger.authSecret" . }}
                  key: {{ .Values.carLedger.auth.secretKeys.clientSecret }}
            - name: QUARKUS_OIDC_AUTHENTICATION_SCOPES
              value: {{ .Values.carLedger.auth.scopes }}
            {{- with .Values.carLedger.auth.audience }}
            - name: QUARKUS_OIDC_TOKEN_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            # encrypts the PKCE state cookie during the login, has to be the same for all replicas
            # (at least 16 chars, 32 recommended)
            - name: QUARKUS_OIDC_AUTHENTICATION_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "carLedger.authSecret" . }}
                  key: {{ .Values.carLedger.auth.secretKeys.stateSecret }}
            - name: QUARKUS_INFINISPAN_CLIENT_HOSTS
              value: {{ .Values.carLedger.infinispan.hosts }}
            - name: QUARKUS_INFINISPAN_CLIENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infinispan.deploy.security.secretName }}
                  key: username
            - name: QUARKUS_INFINISPAN_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infinispan.deploy.security.secretName }}
                  key: password
            - name: QUARKUS_DATASOURCE_JDBC_URL
            {{ if .Values.carLedger.postgres.jdbc }}
              value: {{ .Values.carLedger.postgres.jdbc }}
            {{ else }}
              value: "jdbc:postgresql://{{ .Values.carLedger.postgres.host }}:{{ .Values.carLedger.postgres.port }}/{{ .Values.carLedger.postgres.database }}"
            {{ end }}
            - name: QUARKUS_DATASOURCE_USERNAME
              value: {{ .Values.carLedger.postgres.auth.username }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.carLedger.postgres.auth.secret }}
                  key: {{ .Values.carLedger.postgres.auth.secretPasswordKey }}
            - name: CARLEDGER_ATTACHMENTS_MAX_SIZE
              value: {{ .Values.carLedger.attachments.maxSize | quote }}
            - name: CARLEDGER_ATTACHMENTS_MAX_PER_BILL
              value: {{ .Values.carLedger.attachments.maxPerBill | quote }}
            - name: QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE
              value: {{ .Values.carLedger.attachments.maxRequestSize | quote }}
            {{- with .Values.carLedger.attachments }}
            - name: CARLEDGER_ATTACHMENTS_STORAGE
              value: {{ .storage | quote }}
            - name: CARLEDGER_ATTACHMENTS_MOVE
              value: {{ .moveExisting | quote }}
            {{- if and (eq (upper .storage) "S3") (not .s3.bucket) }}
            {{- fail "carLedger.attachments.s3.bucket is needed with the storage S3" }}
            {{- end }}
            {{- with .s3 }}
            {{- if .bucket }}
            - name: CARLEDGER_ATTACHMENTS_S3_BUCKET
              value: {{ .bucket | quote }}
            - name: QUARKUS_S3_AWS_REGION
              value: {{ .region | quote }}
            - name: QUARKUS_S3_PATH_STYLE_ACCESS
              value: {{ .pathStyle | quote }}
            {{- if .endpoint }}
            - name: QUARKUS_S3_ENDPOINT_OVERRIDE
              value: {{ .endpoint | quote }}
            {{- end }}
            {{- if .existingSecret }}
            - name: QUARKUS_S3_AWS_CREDENTIALS_TYPE
              value: static
            - name: QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .accessKeyIdKey }}
            - name: QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .secretAccessKeyKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: CARLEDGER_BACKUP_TRANSACTION_TIMEOUT
              value: {{ .Values.carLedger.backup.transactionTimeout | quote }}
            {{- with .Values.carLedger.push }}
            {{- if .enabled }}
            - name: CARLEDGER_PUSH_ENABLED
              value: "true"
            - name: CARLEDGER_PUSH_SUBJECT
              value: {{ .subject | default (printf "https://car-ledger.%s" (include "carLedger.host" $)) | quote }}
            {{- if .allowedHosts }}
            - name: CARLEDGER_PUSH_ALLOWED_HOSTS
              value: {{ join "," .allowedHosts | quote }}
            {{- end }}
            - name: CARLEDGER_PUSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | default "car-ledger-push" }}
                  key: {{ .privateKeyKey }}
            {{- end }}
            {{- end }}
            {{- if include "carLedger.trustSources" . }}
            - name: CARLEDGER_TRUST_DIR
              value: /etc/car-ledger/trust
            {{- end }}
            {{- with .Values.carLedger.mail }}
            {{- if .host }}
            - name: CARLEDGER_MAIL_ENABLED
              value: "true"
            - name: CARLEDGER_MAIL_APP_URL
              value: {{ .appUrl | default (printf "https://car-ledger.%s" (include "carLedger.host" $)) | quote }}
            - name: CARLEDGER_MAIL_REMINDERS_CRON
              value: {{ .remindersCron | quote }}
            - name: QUARKUS_MAILER_HOST
              value: {{ .host | quote }}
            - name: QUARKUS_MAILER_PORT
              value: {{ .port | quote }}
            - name: QUARKUS_MAILER_START_TLS
              value: {{ .startTls | quote }}
            - name: QUARKUS_MAILER_TLS
              value: {{ .tls | quote }}
            - name: QUARKUS_MAILER_FROM
              value: {{ .from | default (printf "car-ledger@%s" (include "carLedger.host" $)) | quote }}
            {{- if .username }}
            - name: QUARKUS_MAILER_USERNAME
              value: {{ .username | quote }}
            - name: QUARKUS_MAILER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "carLedger.mail.existingSecret is needed with carLedger.mail.username" .existingSecret }}
                  key: {{ .passwordKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.carLedger.map }}
            {{- if .styleUrl }}
            - name: CARLEDGER_MAP_STYLE_URL
              value: {{ .styleUrl | quote }}
            {{- if .sources }}
            - name: CARLEDGER_MAP_SOURCES
              value: {{ join "," .sources | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.carLedger.tracker.firmware.volume }}
            - name: CARLEDGER_TRACKER_FIRMWARE_DIR
              value: /etc/car-ledger/tracker-firmware
            {{- end }}
            {{- with .Values.carLedger.tracker.suggestions }}
            - name: CARLEDGER_TRACKER_STOP
              value: {{ .stop | quote }}
            - name: CARLEDGER_TRACKER_MIN_DRIVE_DISTANCE
              value: {{ .minDriveDistance | quote }}
            - name: CARLEDGER_TRACKER_MIN_DRIVE_DURATION
              value: {{ .minDriveDuration | quote }}
            {{- end }}
          # liveness and readiness start after the startup probe succeeded
          startupProbe:
            httpGet:
              port: management
              path: /q/health/started
            {{- toYaml .Values.carLedger.startupProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              port: management
              path: /q/health/live
            {{- toYaml .Values.carLedger.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              port: management
              path: /q/health
            {{- toYaml .Values.carLedger.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.carLedger.resources | nindent 12 }}
          {{- $firmware := .Values.carLedger.tracker.firmware }}
          volumeMounts:
            # the only writable directory, the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
            {{- if include "carLedger.trustSources" . }}
            - name: trust
              mountPath: /etc/car-ledger/trust
              readOnly: true
            {{- end }}
            {{- if $firmware.volume }}
            - name: tracker-firmware
              mountPath: /etc/car-ledger/tracker-firmware
              {{- with $firmware.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if include "carLedger.trustSources" . }}
        # the certificates to trust, read once at the start (a renewed CA needs a restart)
        - name: trust
          projected:
            sources:
              {{- include "carLedger.trustSources" . | trim | nindent 14 }}
        {{- end }}
        {{- with $firmware.volume }}
        # the release of the tracker firmware, read on every request
        - name: tracker-firmware
          {{- toYaml . | nindent 10 }}
        {{- end }}
