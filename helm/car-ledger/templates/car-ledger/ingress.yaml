{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-ledger-ingress
  {{- if or .Values.ingress.certManager .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.certManager }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManager }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - car-ledger.{{ .Values.ingress.host }}
      secretName: car-ledger-ingress-tls
  rules:
    - host: car-ledger.{{ .Values.ingress.host }}
      http:
        paths:
          - backend:
              service:
                name: car-ledger-sv
                port:
                  name: http
            path: /
            pathType: Prefix
{{- end }}
