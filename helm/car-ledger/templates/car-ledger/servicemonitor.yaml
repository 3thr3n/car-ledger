{{- /* The metrics of the app for the Prometheus Operator, on the management port */}}
{{- with .Values.carLedger.metrics.serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: car-ledger
  labels:
    app: car-ledger
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: car-ledger
  namespaceSelector:
    matchNames: [ {{ $.Release.Namespace }} ]
  endpoints:
    - port: management
      path: /q/metrics
      interval: {{ .interval }}
{{- end }}
{{- end }}
