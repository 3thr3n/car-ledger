{{- /*
Only the app reaches its PostgreSQL and Infinispan (and what networkPolicy.extraFrom allows). The app takes HTTP from
everywhere (the ingress), its management port with the health and the metrics only from networkPolicy.managementFrom;
the probes of the kubelet are always allowed. Needs a network plugin that enforces NetworkPolicies, ignored by the
others.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- if .Values.carledgerpostgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: primary
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: car-ledger
        {{- if .Values.backup.enabled }}
        # the dumps of the backup CronJob
        - podSelector:
            matchLabels:
              app: car-ledger-backup
        {{- end }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- if .Values.infinispan.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-infinispan
spec:
  podSelector:
    matchLabels:
      clusterName: {{ .Values.infinispan.deploy.nameOverride }}
      app: infinispan-pod
  policyTypes: [ Ingress ]
  ingress:
    # the sessions of the app
    - from:
        - podSelector:
            matchLabels:
              app: car-ledger
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 11222
          protocol: TCP
    # the members of the Infinispan cluster among each other
    - from:
        - podSelector:
            matchLabels:
              clusterName: {{ .Values.infinispan.deploy.nameOverride }}
              app: infinispan-pod
    # the metrics, e.g. for Prometheus
    - ports:
        - port: 11223
          protocol: TCP
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-app
spec:
  podSelector:
    matchLabels:
      app: car-ledger
  policyTypes: [ Ingress ]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    {{- with .Values.networkPolicy.managementFrom }}
    # the metrics, e.g. for Prometheus
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 9000
          protocol: TCP
    {{- end }}
{{- end }}
