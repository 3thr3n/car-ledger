suite: network policies of the app
templates:
  - templates/networkpolicy.yaml
release:
  name: car-ledger
  namespace: car-ledger
set:
  ingress.host: example.com
tests:
  - it: lets only the app reach PostgreSQL and Infinispan
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchLabels:
                  app: car-ledger
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: car-ledger
        documentIndex: 0
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 11222
              protocol: TCP
        documentIndex: 1

  - it: lets further sources in
    set:
      networkPolicy.extraFrom:
        - podSelector:
            matchLabels:
              app: pg-backup
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app: pg-backup
        documentIndex: 0

  - it: lets everyone reach the app, its management port only the kubelet
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: car-ledger-app
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app: car-ledger
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: 8080
                  protocol: TCP

  - it: opens the management port to the sources set
    set:
      networkPolicy.managementFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    documentIndex: 2
    asserts:
      - equal:
          path: spec.ingress[1]
          value:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
            ports:
              - port: 9000
                protocol: TCP

  - it: has no policies when turned off
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
