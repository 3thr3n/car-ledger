suite: generated secrets of the app
templates:
  - templates/secret.yaml
release:
  name: car-ledger
  namespace: car-ledger
set:
  ingress.host: example.com
tests:
  - it: generates the passwords and the key of push on the first install
    asserts:
      - hasDocuments:
          count: 3
      - matchRegex:
          path: stringData.password
          pattern: ^[A-Za-z0-9]{24}$
        documentSelector:
          path: metadata.name
          value: infinispan
      - exists:
          path: data["postgres-password"]
        documentSelector:
          path: metadata.name
          value: car-ledger-postgresql
      - exists:
          path: data["private-key"]
        documentSelector:
          path: metadata.name
          value: car-ledger-push

  - it: keeps the passwords and the key of push on an upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: infinispan
            namespace: car-ledger
          data:
            password: aW5maW5pc3Bhbi1zZWNyZXQ= # infinispan-secret
        - kind: Secret
          apiVersion: v1
          metadata:
            name: car-ledger-postgresql
            namespace: car-ledger
          data:
            postgres-password: cG9zdGdyZXMtc2VjcmV0 # postgres-secret
        - kind: Secret
          apiVersion: v1
          metadata:
            name: car-ledger-push
            namespace: car-ledger
          data:
            private-key: a2V5 # key
    asserts:
      - equal:
          path: stringData.password
          value: infinispan-secret
        documentSelector:
          path: metadata.name
          value: infinispan
      - equal:
          path: stringData["identities-batch"]
          value: user create infinispan -p infinispan-secret -g admin
        documentSelector:
          path: metadata.name
          value: infinispan
      - equal:
          path: data["postgres-password"]
          value: cG9zdGdyZXMtc2VjcmV0
        documentSelector:
          path: metadata.name
          value: car-ledger-postgresql
      - equal:
          path: data["private-key"]
          value: a2V5
        documentSelector:
          path: metadata.name
          value: car-ledger-push

  - it: generates no key of push with an own secret or without push
    set:
      carLedger.push.existingSecret: my-push
    asserts:
      - hasDocuments:
          count: 2
      - notEqual:
          path: metadata.name
          value: car-ledger-push

  - it: generates nothing for an external PostgreSQL and Infinispan
    set:
      carledgerpostgres.enabled: false
      infinispan.enabled: false
      carLedger.push.enabled: false
    asserts:
      - hasDocuments:
          count: 0
