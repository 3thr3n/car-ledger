# Base domain, the app is reachable as car-ledger.<host> and keycloak as keycloak.<host>
ingress:
  enabled: true
  className: nginx
  # defaults to global.host of the stack chart
  host:
  certManager:
  annotations: {}

# Gateway API, alternative to the ingress (ingress-nginx is retired)
httpRoute:
  enabled: false
  parentRefs:
    - name: gateway
      sectionName: https

carLedger:
  replicas: 1
  image:
    repository: ghcr.io/3thr3n/car-ledger
    # defaults to the appVersion of the chart: the image of the same build for published charts
    tag: ""
  # secrets of type kubernetes.io/dockerconfigjson for private registries, e.g. [{name: regcred}]. They
  # apply to every image of the pod: the app and an image volume of tracker.firmware
  imagePullSecrets: []
  securityContext:
    runAsNonRoot: true
  # OpenID Connect provider, Keycloak of the keycloak chart by default, any other works as well
  # (see docs/DEPLOYMENT.md), e.g. authentik of the authentik chart
  auth:
    # issuer, defaults to https://keycloak.<ingress.host>/realms/car-ledger (with authentik of the stack chart
    # https://authentik.<ingress.host>/application/o/car-ledger/)
    url:
    # defaults to carLedger (car-ledger with authentik of the stack chart)
    clientId:
    scopes: "offline_access,email,profile"
    # audience the access tokens of service accounts must have, defaults to the client id; "any" turns the
    # check off (see docs/DEPLOYMENT.md#service-accounts)
    audience:
    # secret with the client secret and the state secret (encrypts the PKCE state cookie, >= 16 chars),
    # defaults to keycloak (car-ledger-oidc, generated by the authentik chart, with authentik of the stack chart)
    existingSecret:
    secretKeys:
      clientSecret: "secret"
      stateSecret: "state-secret"
  # receipts and other files attached to the entries, the documents of the modifications and the
  # reports of the HUs. Photos are scaled down by the browser (about 0.5 MB), PDFs are uploaded as they are
  attachments:
    # largest file
    maxSize: 10M
    maxPerBill: 10
    # where new files are stored: DB (PostgreSQL) or S3. The files of the other storage stay readable,
    # with moveExisting they are moved into this one in the background (see docs/DEPLOYMENT.md)
    storage: DB
    moveExisting: false
    # an S3 compatible storage (AWS, MinIO, Garage, ...), used with a bucket. The bucket must exist,
    # the app stores its files below attachments/
    s3:
      bucket: ""
      # empty for AWS, e.g. https://s3.example.com for others
      endpoint: ""
      region: us-east-1
      # bucket in the path of the URL instead of the host name, needed by most storages besides AWS
      pathStyle: true
      # secret with the access key, without one the default chain of AWS is used (e.g. IRSA)
      existingSecret: ""
      accessKeyIdKey: accessKeyId
      secretAccessKeyKey: secretAccessKey
    # largest request, a bit more than maxSize for the multipart envelope. With className nginx the
    # ingress gets the annotation nginx.ingress.kubernetes.io/proxy-body-size with this value (unless
    # set in ingress.annotations); other proxies in front of the app need a similar limit
    maxRequestSize: 12M
  # backup of the users in the settings: seconds a download or a restore may take, a car that keeps its
  # track points forever has millions of them. A restore is an upload: a larger backup needs a larger
  # attachments.maxRequestSize
  backup:
    transactionTimeout: 1800
  # map of the GPS tracks (see docs/GPS_TRACKER.md): the browser loads a MapLibre style and its tiles,
  # e.g. of an own tile server or of a provider with a key. Without a styleUrl the map is hidden
  map:
    # e.g. https://tiles.openfreemap.org/styles/liberty or https://api.maptiler.com/maps/streets-v2/style.json?key=…
    styleUrl:
    # further origins the style loads tiles, glyphs or sprites from, e.g. ["https://tiles.example.com"];
    # the origin of the styleUrl is allowed anyway
    sources: []
  # GPS trackers (see docs/GPS_TRACKER.md)
  tracker:
    # release of the tracker firmware (manifest.json and the files it lists), the users flash it from the
    # browser. It isn't part of the image and only served to logged-in users. Without a volume, flashing
    # is hidden
    firmware:
      # a volume source, e.g.
      # persistentVolumeClaim:
      #   claimName: tracker-firmware
      # or an OCI image with the files (Kubernetes 1.33+), from a private registry with imagePullSecrets:
      # image:
      #   reference: registry.example.com/car-ledger/tracker-firmware:v1.0.0
      #   pullPolicy: IfNotPresent
      volume: {}
      # directory of the volume with the manifest.json, its root without one
      subPath: ""
    # drives of the tracks are suggested as forgotten trips in the trip log: a drive ends after a stop
    # this long (no points, or a car that doesn't move), shorter drives are ignored. Durations like
    # 5M (minutes) or PT90S
    suggestions:
      stop: 5M
      # meters
      minDriveDistance: 500
      minDriveDuration: 2M
  # notifications as push messages to the browsers that turn them on in the settings (see
  # docs/DEPLOYMENT.md#push). Needs no other service: the chart generates the key of the server
  # into the secret car-ledger-push and keeps it, a new key ends all subscriptions
  push:
    enabled: true
    # contact for the push services (mailto: or https:), defaults to https://car-ledger.<ingress.host>
    subject:
    # own secret with the key (EC PRIVATE KEY, P-256) instead of the generated one
    existingSecret:
    privateKeyKey: "private-key"
    # hosts of the push services the messages may go to, e.g. ["*.googleapis.com", "push.example.com"];
    # empty for Google, Mozilla, Apple and Microsoft. A subscription cannot point the app to other hosts
    allowedHosts: []
  # notifications by e-mail (new car requests to the admins, decisions to the user, see
  # docs/DEPLOYMENT.md#e-mail); without a host no mails are sent. The address of a user comes from the
  # claim "email" of the login
  mail:
    # SMTP server
    host:
    port: 587
    # STARTTLS: DISABLED, OPTIONAL or REQUIRED; tls: true for TLS from the start (usually port 465)
    startTls: REQUIRED
    tls: false
    # sender, e.g. "CarLedger <car-ledger@example.com>", defaults to car-ledger@<ingress.host>
    from:
    # login at the SMTP server, without a username none
    username:
    # secret with the password of the username
    existingSecret:
    passwordKey: "password"
    # where the links in the mails point to, defaults to https://car-ledger.<ingress.host>
    appUrl:
    # when the due reminders are mailed (Quartz cron), in UTC: 07:00 UTC by default, "off" for never
    remindersCron: "0 0 7 * * ?"
  # certificates the app trusts for its own HTTPS requests (the login at the identity provider, SMTP,
  # push) besides the public CAs, e.g. self-signed ones or the CA of a company, as PEM. See
  # docs/DEPLOYMENT.md#self-signed-certificates
  trust:
    # the ca.crt of the TLS secrets of the ingresses, as cert-manager writes it for a CA or self-signed
    # issuer: of the app (car-ledger-ingress-tls) and, without auth.url, of the identity provider of the
    # charts (keycloak.<ingress.host>-tls or authentik-ingress-tls). Skipped while a secret or the key is
    # missing
    ingressCA: true
    # further certificates, a key of a secret or a ConfigMap each (one or several certificates), e.g.
    # - secret: keycloak.example.com-tls
    #   key: ca.crt
    # - configMap: company-ca
    #   key: ca.pem
    certificates: []
  # probes of the app, the paths are fixed. The startup probe gives a slow start (small CPU limit,
  # database migrations) failureThreshold * periodSeconds, 150 s by default, before the pod is restarted
  startupProbe:
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 2
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 20
    timeoutSeconds: 2
  readinessProbe:
    failureThreshold: 3
    periodSeconds: 5
    timeoutSeconds: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 100Mi
    limits:
      cpu: 350m
      memory: 768Mi
      ephemeral-storage: 500Mi
  infinispan:
    hosts: "car-ledger-infinispan"
  postgres:
    jdbc:
    host: "car-ledger-postgresql"
    port: 5432
    database: car-ledger
    auth:
      username: "postgres"
      secret: "car-ledger-postgresql"
      secretPasswordKey: "postgres-password"
      secretUsernameKey:

carledgerpostgres:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "17-bookworm"
  auth:
    database: "car-ledger"
    existingSecret: "car-ledger-postgresql"
    secretKeys:
      adminPasswordKey: "postgres-password"
  persistence:
    size: 8Gi
    storageClass:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# only the app reaches its PostgreSQL and Infinispan; needs a network plugin that enforces NetworkPolicies
networkPolicy:
  enabled: true
  # further sources, e.g. a backup tool: entries of NetworkPolicy ingress "from"
  # (- podSelector: {matchLabels: {app: pg-backup}})
  extraFrom: []

infinispan:
  enabled: true
  images:
    # 15.2 runs everywhere. The chart default 16.2 needs a x86-64-v3 CPU (not offered e.g. by VMs
    # with the default QEMU CPU model), switch to quay.io/infinispan/server:16.2 if your nodes support it
    server: quay.io/infinispan/server:15.2
  deploy:
    expose:
      type: ""
    nameOverride: "car-ledger-infinispan"
    # the server runs as user 185: a new volume of block storage (e.g. Longhorn) belongs to root, without the group the
    # server can not write its data directory (Permission denied on ___global.lck)
    securityContext:
      fsGroup: 185
    security:
      secretName: infinispan
