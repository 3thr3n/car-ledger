{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  {{- if or .Values.ingress.certManager .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.certManager }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManager }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls }}
  tls:
    - hosts:
        - {{ required "hostname is required" .Values.hostname }}
      secretName: n8n-ingress-tls
  {{- end }}
  rules:
    - host: {{ required "hostname is required" .Values.hostname }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "n8n.service" . }}
                port:
                  name: http
            path: /
            pathType: Prefix
{{- end }}
