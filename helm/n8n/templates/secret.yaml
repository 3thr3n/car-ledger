{{- /* Secrets are generated on the first install and kept on upgrades */}}
{{- $generated := (lookup "v1" "Secret" .Release.Namespace "n8n-generated").data | default dict }}
{{- $url := printf "%s://%s" (include "n8n.scheme" .) (required "hostname is required" .Values.hostname) }}
{{- /* the signature key, generated once: kept from this namespace, else from the one of CarLedger */}}
{{- $webhookNamespace := .Values.carLedger.namespace | default .Release.Namespace }}
{{- $webhook := (lookup "v1" "Secret" .Release.Namespace "car-ledger-webhook").data | default dict }}
{{- if not $webhook }}
{{- $webhook = (lookup "v1" "Secret" $webhookNamespace "car-ledger-webhook").data | default dict }}
{{- end }}
{{- $webhookSecret := get $webhook "webhook-secret" | default (randAlphaNum 64 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: n8n-generated
type: Opaque
data:
  # encrypts the credentials stored in n8n, never change it after the first install
  N8N_ENCRYPTION_KEY: {{ get $generated "N8N_ENCRYPTION_KEY" | default (randAlphaNum 64 | b64enc) }}
  N8N_HOST: {{ .Values.hostname | b64enc }}
  N8N_PORT: {{ "5678" | b64enc }}
  N8N_PROTOCOL: {{ include "n8n.scheme" . | b64enc }}
  N8N_WEBHOOK_URL: {{ $url | b64enc }}
  N8N_EDITOR_BASE_URL: {{ $url | b64enc }}
  CARLEDGER_URL: {{ printf "%s://%s" (include "n8n.scheme" .) (required "carLedger.hostname is required" .Values.carLedger.hostname) | b64enc }}
  CARLEDGER_WEBHOOK_SECRET: {{ $webhookSecret }}

{{- $namespaces := list .Release.Namespace }}
{{- if ne $webhookNamespace .Release.Namespace }}
{{- /* the pods of CarLedger only read secrets of their own namespace */}}
{{- $namespaces = append $namespaces $webhookNamespace }}
{{- end }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: car-ledger-webhook
  namespace: {{ . }}
type: Opaque
data:
  # signs the webhooks of CarLedger (X-CarLedger-Signature), n8n checks it
  webhook-secret: {{ $webhookSecret }}
{{- end }}
