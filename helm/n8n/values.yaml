# public host name of n8n, e.g. n8n.example.com: the editor, and the links of "Send and Wait for Response"
# that the administrators open. Defaults to n8n.<global.host> of the stack chart
hostname: ""
# whether n8n and CarLedger are reached via https
tls: true

carLedger:
  # public host name of CarLedger, e.g. car-ledger.example.com; the workflow calls the admin API at
  # $env.CARLEDGER_URL. Defaults to car-ledger.<global.host> of the stack chart
  hostname: ""
  # The generated signature key of the webhooks (key "webhook-secret") is in the secret car-ledger-webhook,
  # set carLedger.webhook.existingSecret of the car-ledger chart to it. Namespace of CarLedger, if it is not the
  # one of n8n: the secret is created there as well (the namespace has to exist).
  namespace: ""

ingress:
  enabled: true
  className: nginx
  # cluster issuer of cert-manager, e.g. lets-encrypt
  certManager:
  annotations: {}

# Gateway API, alternative to the ingress
httpRoute:
  enabled: false
  parentRefs:
    - name: gateway
      sectionName: https

# Values of the n8n chart, see https://github.com/n8n-io/n8n-hosting/tree/main/charts/n8n
n8n:
  # the resources are named n8n, independent of the release name
  fullnameOverride: n8n
  # one pod with SQLite on a volume: enough for the approval of car requests
  queueMode:
    enabled: false
  redis:
    enabled: false
  database:
    type: sqlite
    useExternal: false
  persistence:
    enabled: true
    size: 2Gi
  # the volume is ReadWriteOnce, the old pod has to stop before the new one starts
  strategy:
    type: Recreate
  # encryption key, host and protocol come from the secret n8n-generated (templates/secret.yaml)
  secretRefs:
    existingSecret: n8n-generated
  config:
    extraEnvFrom:
      # N8N_WEBHOOK_URL, N8N_EDITOR_BASE_URL, CARLEDGER_URL and CARLEDGER_WEBHOOK_SECRET
      - secretRef:
          name: n8n-generated
    extraEnv:
      # the Code node "Verify signature" computes the HMAC with crypto and reads the secret from $env,
      # which n8n 2 blocks by default
      - name: NODE_FUNCTION_ALLOW_BUILTIN
        value: crypto
      - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
  # ingress and HTTPRoute come from this chart (templates/ingress.yaml), driven by hostname
  ingress:
    enabled: false
