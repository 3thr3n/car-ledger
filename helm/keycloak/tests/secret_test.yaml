suite: secrets of Keycloak and of CarLedger
templates:
  - templates/secret.yaml
release:
  name: keycloak
  namespace: auth
tests:
  - it: generates the passwords of PostgreSQL and of the admin
    asserts:
      - hasDocuments:
          count: 2
      - exists:
          path: data.password
        documentSelector:
          path: metadata.name
          value: keycloak-postgresql
      - equal:
          path: data.username
          value: Y2FyLWxlZGdlcg== # car-ledger
        documentSelector:
          path: metadata.name
          value: keycloak-admin

  - it: takes the password of the admin from the values
    set:
      keycloak.auth.adminPassword: secret
    asserts:
      - equal:
          path: data.password
          value: c2VjcmV0
        documentSelector:
          path: metadata.name
          value: keycloak-admin

  - it: generates the secret keycloak of CarLedger with its host name
    set:
      carLedger.hostname: car-ledger.example.com
    asserts:
      - hasDocuments:
          count: 3
      - matchRegex:
          path: data.secret
          pattern: ^[A-Za-z0-9+/=]{80,}$
        documentSelector:
          path: metadata.name
          value: keycloak
      - exists:
          path: data["state-secret"]
        documentSelector:
          path: metadata.name
          value: keycloak

  - it: creates the secret keycloak in the namespace of CarLedger as well
    set:
      carLedger.hostname: car-ledger.example.com
      carLedger.namespace: car-ledger
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.namespace
          value: car-ledger
        documentIndex: 3

  - it: keeps the passwords and the secrets on an upgrade
    set:
      carLedger.hostname: car-ledger.example.com
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: keycloak-postgresql
            namespace: auth
          data:
            password: cGc=
            postgres-password: cm9vdA==
        - kind: Secret
          apiVersion: v1
          metadata:
            name: keycloak
            namespace: auth
            annotations:
              meta.helm.sh/release-name: keycloak
          data:
            secret: Y2xpZW50
            state-secret: c3RhdGU=
    asserts:
      - equal:
          path: data
          value:
            password: cGc=
            postgres-password: cm9vdA==
        documentSelector:
          path: metadata.name
          value: keycloak-postgresql
      - equal:
          path: data
          value:
            secret: Y2xpZW50
            state-secret: c3RhdGU=
        documentSelector:
          path: metadata.name
          value: keycloak

  - it: keeps a secret keycloak created by hand and does not render it
    set:
      carLedger.hostname: car-ledger.example.com
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: keycloak
            namespace: auth
          data:
            secret: aGFuZA==
    asserts:
      - hasDocuments:
          count: 2
      - notEqual:
          path: metadata.name
          value: keycloak
