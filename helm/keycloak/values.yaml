# Values of the codecentric keycloakx chart, see https://github.com/codecentric/helm-charts/tree/master/charts/keycloakx
keycloak:
  # public host name, e.g. keycloak.example.com
  hostname: ""
  # whether keycloak is reached via https
  tls: true
  # admin, created on the first start. An empty password is generated and kept in the secret <release>-admin
  auth:
    adminUser: car-ledger
    adminPassword: ""

  nameOverride: keycloak
  command:
    - /opt/keycloak/bin/kc.sh
  args:
    - start
  http:
    relativePath: /
  proxy:
    mode: xforwarded
  metrics:
    enabled: false
  # database of the postgresql below, defaults match the former bitnami chart
  database:
    vendor: postgres
    database: bitnami_keycloak
    username: bn_keycloak
  extraEnv: |
    - name: KC_DB_URL_HOST
      value: {{ .Release.Name }}-postgresql
    - name: KC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Release.Name }}-postgresql
          key: password
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: {{ .Release.Name }}-admin
          key: username
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Release.Name }}-admin
          key: password
    {{- if .Values.hostname }}
    - name: KC_HOSTNAME
      value: {{ if .Values.tls }}https{{ else }}http{{ end }}://{{ .Values.hostname }}
    {{- else }}
    - name: KC_HOSTNAME_STRICT
      value: "false"
    {{- end }}
  # the first start after an update migrates the database, which can take long on small nodes
  startupProbe: |
    httpGet:
      path: /health
      port: '{{ .Values.http.internalPort }}'
    initialDelaySeconds: 15
    timeoutSeconds: 2
    failureThreshold: 180
    periodSeconds: 5
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: lets-encrypt
    rules:
      - host: "{{ .Values.hostname }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - "{{ .Values.hostname }}"
        secretName: "{{ .Values.hostname }}-tls"

  # Gateway API, alternative to the ingress
  httpRoute:
    enabled: false
    parentRefs:
      - name: gateway
        sectionName: https
    hostnames: []
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database and user are taken from keycloak.database
postgresql:
  image:
    repository: docker.io/library/postgres
    tag: "17-bookworm"
  persistence:
    size: 8Gi
    storageClass:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
