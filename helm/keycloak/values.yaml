# CarLedger as OpenID Connect client. With its host name, the realm car-ledger is imported on the first start of
# Keycloak: the confidential client carLedger (PKCE S256, the redirect URIs of CarLedger), the roles user (a default
# role, every new user gets it) and admin. The client secret and the state secret are generated into the secret
# keycloak, which the car-ledger chart reads by default. An existing realm is kept as it is, so is a secret keycloak
# created by hand. Without the host name, set up the realm and the secret by hand (docs/DEPLOYMENT.md).
carLedger:
  # public host name of CarLedger, e.g. car-ledger.example.com, defaults to car-ledger.<global.host> of the stack chart
  hostname: ""
  # Namespace of CarLedger, if it is not the one of Keycloak: the secret keycloak is created there as well (the
  # namespace has to exist)
  namespace: ""

# Values of the codecentric keycloakx chart, see https://github.com/codecentric/helm-charts/tree/master/charts/keycloakx
keycloak:
  # public host name, e.g. keycloak.example.com, defaults to keycloak.<global.host> of the stack chart
  hostname: ""
  # whether Keycloak and CarLedger are reached via https
  tls: true
  # admin, created on the first start. An empty password is generated and kept in the secret <release>-admin
  auth:
    adminUser: car-ledger
    adminPassword: ""

  nameOverride: keycloak
  # the keycloakx chart defaults to 26.7.4, whose JDK still trusts the compromised eMudhra CAs (CVE-2026-91403)
  image:
    tag: "26.8.1"
  command:
    - /opt/keycloak/bin/kc.sh
  # imports the realm car-ledger of templates/realm.yaml on the first start, if it does not exist yet
  args:
    - start
    - --import-realm
  http:
    relativePath: /
  proxy:
    mode: xforwarded
  # also turns on the readiness probe, the keycloakx chart sets it only with the metrics. Both are on the management
  # port, which the NetworkPolicy closes to other pods (networkPolicy.managementFrom)
  metrics:
    enabled: true
  # database of the postgresql below, defaults match the former bitnami chart
  database:
    vendor: postgres
    database: bitnami_keycloak
    username: bn_keycloak
  extraEnv: |
    - name: KC_DB_URL_HOST
      value: {{ include "carLedgerKeycloak.prefix" . }}-postgresql
    - name: KC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ include "carLedgerKeycloak.prefix" . }}-postgresql
          key: password
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: {{ include "carLedgerKeycloak.prefix" . }}-admin
          key: username
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ include "carLedgerKeycloak.prefix" . }}-admin
          key: password
    # client secret of CarLedger, for the import of the realm (templates/realm.yaml)
    - name: CAR_LEDGER_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: keycloak
          key: secret
          optional: true
    {{- $hostname := include "carLedgerKeycloak.hostname" . }}
    {{- if $hostname }}
    - name: KC_HOSTNAME
      value: {{ if .Values.tls }}https{{ else }}http{{ end }}://{{ $hostname }}
    {{- else }}
    - name: KC_HOSTNAME_STRICT
      value: "false"
    {{- end }}
  extraVolumes: |
    - name: realm
      configMap:
        name: {{ include "carLedgerKeycloak.prefix" . }}-realm
  extraVolumeMounts: |
    - name: realm
      mountPath: /opt/keycloak/data/import
      readOnly: true
  # the first start after an update migrates the database, which can take long on small nodes
  startupProbe: |
    httpGet:
      path: /health
      port: '{{ .Values.http.internalPort }}'
    initialDelaySeconds: 15
    timeoutSeconds: 2
    failureThreshold: 180
    periodSeconds: 5
  # out of the service while it can't answer, e.g. without its database
  readinessProbe: |
    httpGet:
      path: /health/ready
      port: '{{ .Values.http.internalPort }}'
    timeoutSeconds: 2
    periodSeconds: 10
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # the defaults of keycloakx (uid 1000, fsGroup 1000) hardened; the root filesystem stays writable, Keycloak keeps
  # its build and temporary files in /opt/keycloak/data
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ "ALL" ]
  # Keycloak doesn't call the Kubernetes API (no KUBE_PING, allowReadPods is off)
  serviceAccount:
    automountServiceAccountToken: false

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: lets-encrypt
    rules:
      - host: '{{ include "carLedgerKeycloak.hostname" . }}'
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - '{{ include "carLedgerKeycloak.hostname" . }}'
        secretName: '{{ include "carLedgerKeycloak.hostname" . }}-tls'

  # Gateway API, alternative to the ingress (the hostnames are not derived from hostname)
  httpRoute:
    enabled: false
    parentRefs:
      - name: gateway
        sectionName: https
    hostnames: []
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database and user are taken from keycloak.database
postgresql:
  image:
    repository: docker.io/library/postgres
    tag: "17-bookworm"
  persistence:
    size: 8Gi
    storageClass:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# only Keycloak reaches its PostgreSQL; Keycloak itself takes HTTP (8080) from everywhere, and everything from its
# other replicas (the cache). Needs a network plugin that enforces NetworkPolicies
networkPolicy:
  enabled: true
  # further sources for the PostgreSQL, e.g. a backup tool: entries of NetworkPolicy ingress "from"
  extraFrom: []
  # sources for the management port of Keycloak (9000: /health, /metrics), e.g. Prometheus: entries of NetworkPolicy
  # ingress "from". The probes of the kubelet are always allowed
  managementFrom: []
