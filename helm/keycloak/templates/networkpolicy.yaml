{{- /*
Only keycloak reaches its PostgreSQL (and what networkPolicy.extraFrom allows). keycloak takes HTTP from everywhere (the
ingress, CarLedger), everything from its other replicas (the cache), the management port with the health and the metrics
only from networkPolicy.managementFrom; the probes of the kubelet are always allowed. Needs a network plugin that enforces
NetworkPolicies, ignored by the others.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "carLedgerKeycloak.prefix" . }}-postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ include "carLedgerKeycloak.prefix" . }}
      app.kubernetes.io/component: primary
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "carLedgerKeycloak.prefix" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [ Ingress ]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.networkPolicy.managementFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 9000
          protocol: TCP
    {{- end }}
{{- end }}
