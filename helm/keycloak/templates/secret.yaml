{{- /* Keep already generated passwords (also the ones created by the former bitnami chart) */}}
{{- $pgSecretName := printf "%s-postgresql" .Release.Name }}
{{- $pgSecret := (lookup "v1" "Secret" .Release.Namespace $pgSecretName).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgSecretName }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  password: {{ $pgSecret.password | default (randAlphaNum 24 | b64enc) }}
  postgres-password: {{ get $pgSecret "postgres-password" | default (randAlphaNum 24 | b64enc) }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.auth.adminUser | quote }}
  password: {{ .Values.keycloak.auth.adminPassword | quote }}
