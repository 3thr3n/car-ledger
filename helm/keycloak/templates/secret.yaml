{{- /* Keep already generated passwords (also the ones created by the former bitnami chart) */}}
{{- $pgSecretName := printf "%s-postgresql" (include "carLedgerKeycloak.prefix" .) }}
{{- $pgSecret := (lookup "v1" "Secret" .Release.Namespace $pgSecretName).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgSecretName }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ include "carLedgerKeycloak.prefix" . }}
type: Opaque
data:
  password: {{ $pgSecret.password | default (randAlphaNum 24 | b64enc) }}
  postgres-password: {{ get $pgSecret "postgres-password" | default (randAlphaNum 24 | b64enc) }}

---
{{- $adminSecretName := printf "%s-admin" (include "carLedgerKeycloak.prefix" .) }}
{{- $adminSecret := (lookup "v1" "Secret" .Release.Namespace $adminSecretName).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSecretName }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ include "carLedgerKeycloak.prefix" . }}
type: Opaque
data:
  username: {{ .Values.keycloak.auth.adminUser | b64enc }}
  # set explicitly, kept from a previous install or generated
  password: {{ .Values.keycloak.auth.adminPassword | b64enc | default $adminSecret.password | default (randAlphaNum 24 | b64enc) }}

{{- /*
The secret of CarLedger with the client secret (key "secret", set in the realm on its import) and the state secret
(key "state-secret"), read by the car-ledger chart by default. Generated once: kept from this namespace, else from the
one of CarLedger. A secret keycloak that was created by hand (not by this release) is kept and not rendered.
*/}}
{{- if include "carLedgerKeycloak.carLedgerHostname" . }}
{{- $namespace := .Values.carLedger.namespace | default .Release.Namespace }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "keycloak" }}
{{- $data := $existing.data | default dict }}
{{- if not $data }}
{{- $data = (lookup "v1" "Secret" $namespace "keycloak").data | default dict }}
{{- end }}
{{- $secret := $data.secret | default (randAlphaNum 64 | b64enc) }}
{{- $stateSecret := get $data "state-secret" | default (randAlphaNum 64 | b64enc) }}
{{- $namespaces := list .Release.Namespace }}
{{- if ne $namespace .Release.Namespace }}
{{- /* the pods of CarLedger only read secrets of their own namespace */}}
{{- $namespaces = append $namespaces $namespace }}
{{- end }}
{{- range $namespaces }}
{{- $current := lookup "v1" "Secret" . "keycloak" }}
{{- $owner := dig "metadata" "annotations" "meta.helm.sh/release-name" "" ($current | default dict) }}
{{- if or (not $current) (eq $owner $.Release.Name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: {{ . }}
type: Opaque
data:
  # client secret of CarLedger, set in the realm when it is imported
  secret: {{ $secret }}
  # encrypts the PKCE state cookie of CarLedger during the login
  state-secret: {{ $stateSecret }}
{{- end }}
{{- end }}
{{- end }}
