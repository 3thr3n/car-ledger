{{- $kc := .Values.keycloak }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # local caches only, so keep a single replica
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: "{{ $kc.image.repository }}:{{ $kc.image.tag }}"
          args: [ "start" ]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-admin
                  key: password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ .Release.Name }}-postgresql
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: KC_CACHE
              value: local
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: {{ $kc.metrics.enabled | quote }}
            {{- if $kc.ingress.hostname }}
            - name: KC_HOSTNAME
              value: "{{ if $kc.ingress.tls }}https{{ else }}http{{ end }}://{{ $kc.ingress.hostname }}"
            {{- else }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            {{- end }}
            {{- with $kc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              port: management
              path: /health/started
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              port: management
              path: /health/live
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: management
              path: /health/ready
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $kc.resources | nindent 12 }}
