{{- $ingress := .Values.keycloak.ingress }}
{{ if $ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ingress.ingressClassName }}
  {{- if $ingress.tls }}
  tls:
    - hosts:
        - {{ $ingress.hostname }}
      secretName: {{ $ingress.hostname }}-tls
  {{- end }}
  rules:
    - host: {{ $ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
{{ end }}
