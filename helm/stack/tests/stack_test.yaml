suite: the stack chart
templates:
  - templates/validate.yaml
  - charts/app/templates/car-ledger/deployment.yaml
  - charts/app/templates/postgresql/statefulset.yaml
  - charts/keycloak/templates/secret.yaml
  - charts/authentik/templates/secret.yaml
  - charts/mapMatching/templates/service.yaml
release:
  name: car-ledger
  namespace: car-ledger
set:
  global.host: example.com
tests:
  - it: needs the base domain
    template: templates/validate.yaml
    set:
      global.host: ""
    asserts:
      - failedTemplate:
          errorPattern: global.host is required

  - it: allows only one identity provider
    template: templates/validate.yaml
    set:
      global.keycloak.enabled: true
      global.authentik.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: Enable only one identity provider

  - it: logs the app in at Keycloak of the stack
    template: charts/app/templates/car-ledger/deployment.yaml
    set:
      global.keycloak.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_OIDC_AUTH_SERVER_URL
            value: https://keycloak.example.com/realms/car-ledger

  - it: logs the app in at authentik of the stack with its secret
    template: charts/app/templates/car-ledger/deployment.yaml
    set:
      global.authentik.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_OIDC_AUTH_SERVER_URL
            value: https://authentik.example.com/application/o/car-ledger/
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_OIDC_CREDENTIALS_SECRET
            valueFrom:
              secretKeyRef:
                name: car-ledger-oidc
                key: secret

  - it: passes the values of the app under app
    template: charts/app/templates/car-ledger/deployment.yaml
    set:
      app.carLedger.replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: keeps the fixed names of the PostgreSQL of the app
    template: charts/app/templates/postgresql/statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: metadata.name
          value: car-ledger-postgresql

  - it: names the PostgreSQL of Keycloak after it and creates the secret of the app
    template: charts/keycloak/templates/secret.yaml
    set:
      global.keycloak.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: car-ledger-keycloak-postgresql
        documentIndex: 0
      - equal:
          path: metadata.name
          value: keycloak
        documentIndex: 2

  - it: creates the secret of the app with authentik
    template: charts/authentik/templates/secret.yaml
    set:
      global.authentik.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: car-ledger-oidc
        documentIndex: 2

  - it: lets the app use the map matching of the stack
    set:
      global.mapMatching.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARLEDGER_MAP_MATCHING_URL
            value: http://car-ledger-map-matching:8002
        template: charts/app/templates/car-ledger/deployment.yaml
      - equal:
          path: metadata.name
          value: car-ledger-map-matching
        template: charts/mapMatching/templates/service.yaml
